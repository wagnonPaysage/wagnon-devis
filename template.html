<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<h1>🌲 Wagnon Paysage</h1>

<style>
body{
  font-family: Arial, sans-serif;
  background:#ececec;
  margin:0;
  padding:40px;
}
.page{
  width:794px;
  margin:auto;
  background:white;
  padding:55px;
  box-sizing:border-box;
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}
.logo{
  width:150px;
}
.right{
  text-align:right;
}
.right h2{
  margin:0;
  color:#4b5563;
}
.right p{
  margin-top:12px;
  color:#666;
}
h1{
  color:#4b5563;
  margin:35px 0;
}
.infos p{
  margin:12px 0;
  color:#555;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:35px;
}
th{
  text-align:left;
  border-top:1px solid #ddd;
  border-bottom:1px solid #ddd;
  padding:14px 0;
  color:#666;
}
td{
  padding:18px 0;
}
.total{
  margin-top:40px;
  text-align:right;
}
.box{
  display:inline-block;
  background:#f3f4f6;
  padding:18px 30px;
  font-size:24px;
  font-weight:bold;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="page">

<div class="header">
  <img src="6FA29E0F-4DD1-46C9-9DD9-17AFA90BFEB8.jpeg" class="logo">

  <div class="right">
    <h2>DEVIS N°0001</h2>
    <p>Date : 24/08/2026</p>
  </div>
</div>

<h1>DEVIS TERRAIN</h1>

<div class="infos">
  <p><b>Client :</b> Nom Prénom</p>
  <p><b>Prestation :</b> Taille de haie</p>
  <p><b>Mètres linéaires :</b> 20 m</p>
  <p><b>Hauteur :</b> 1.8 m</p>
  <p><b>Faces à tailler :</b> 3</p>
</div>

<table>
<tr>
<th>Désignation</th>
<th>Qté</th>
<th>PU</th>
<th>Total</th>
</tr>

<tr>
<td>Taille de haie</td>
<td>20 m</td>
<td>12 €</td>
<td>240 €</td>
</tr>
</table>

<div class="total">
<h2>TOTAL TTC</h2>
<div class="box">240 €</div>
</div>

</div>

<button id="installBtn" style="position:fixed;bottom:20px;right:20px;padding:12px 18px;border:none;border-radius:10px;background:#2e7d32;color:white;font-weight:bold;cursor:pointer;display:none;">
  📲 Installer l'application
</button>

<script>
let deferredPrompt;

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBtn").style.display = "block";
});

document.getElementById("installBtn").addEventListener("click", async () => {
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  document.getElementById("installBtn").style.display = "none";
});
</script>

</body>
</html>
